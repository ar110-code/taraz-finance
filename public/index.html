<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تراز | مدیریت مالی هوشمند</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #a1a1aa;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <img src="icon-192.png" alt="تراز" class="logo">
  <div class="title">تَـراز</div>
  <div class="subtitle">در حال بارگذاری سامانه هوشمند مالی...</div>
  <script>
    window.location.href = '/';
  </script>
</body>
</html>
